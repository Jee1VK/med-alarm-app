name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Exact Alarm Permissions in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n\n    <application|' "$MANIFEST"
          fi

      - name: Embed Custom MedClock App Icon & Loud Alarm Ringtone WAV
        run: |
          python3 - << 'EOF'
          import math, os, shutil, struct, wave

          # 1. Embed custom MedClock launcher icon across all Android mipmap buckets
          res_dir = "android/app/src/main/res"
          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.isdir(anydpi):
              shutil.rmtree(anydpi)
          for bucket in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              d = os.path.join(res_dir, bucket)
              os.makedirs(d, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  shutil.copyfile("public/icon-512.png", os.path.join(d, name))

          # 2. Synthesize a loud, unmistakable 3-minute (180s) alarm ringtone WAV in res/raw/medclock_alarm.wav
          # Uses speaker-optimized 1.3-2.6 kHz harmonics + soft-clip limiter so phone speakers ring loudly until stopped.
          raw_dir = os.path.join(res_dir, "raw")
          os.makedirs(raw_dir, exist_ok=True)
          wav_path = os.path.join(raw_dir, "medclock_alarm.wav")
          sample_rate = 8000
          one_sec_samples = sample_rate
          one_sec_frames = bytearray()
          for i in range(one_sec_samples):
              t = i / sample_rate
              val = 0.0
              # Loud, urgent 3-pulse dual-harmonic alarm bell every second
              if t < 0.18 or (0.24 <= t < 0.42) or (0.48 <= t < 0.72):
                  f1 = 1318.51 if t < 0.48 else 1760.0
                  f2 = f1 * 1.5
                  raw = (
                      0.65 * math.sin(2.0 * math.pi * f1 * t)
                      + 0.45 * math.sin(2.0 * math.pi * f2 * t)
                      + 0.25 * math.sin(4.0 * math.pi * f1 * t)
                  )
                  val = math.tanh(raw * 1.6) * 0.98
              s = max(-32767, min(32767, int(val * 32767)))
              one_sec_frames += struct.pack("<h", s)
          with wave.open(wav_path, "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sample_rate)
              # Repeat 1-second loud pattern 180 times = full 3 minutes (until user stops/dismisses)
              wf.writeframes(one_sec_frames * 180)
          EOF

      - name: Configure Permanent Signing & Auto-Incrementing Version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/medclock-release.jks
          python3 - << 'EOF'
          import os, re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              text = f.read()
          run_num = os.environ["RUN_NUMBER"]
          text = re.sub(r"versionCode\s+\d+", f"versionCode {run_num}", text)
          text = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_num}"', text)
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("medclock-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release"""
          text = text.replace("    buildTypes {\n        release {", signing_block, 1)
          with open(path, "w") as f:
              f.write(text)
          EOF

      - name: Build Signed Release Android APK (Gradle)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MedClock.apk

      - name: Upload MedClock APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedClock-Android-APK
          path: MedClock.apk
          retention-days: 30

      - name: Auto-Publish Latest GitHub Release (MedClock.apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest MedClock.apk --clobber
          else
            gh release create latest MedClock.apk \
              --title "MedClock (Latest Android APK)" \
              --notes "Always-updated signed Android APK for MedClock. Updates install in-place without uninstalling."
          fi
